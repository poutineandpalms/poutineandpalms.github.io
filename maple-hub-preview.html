<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maple — Nest Hub Preview (1024×600)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1a1a1a;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 16px;
    color: #e8e8e8;
  }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
  p { font-size: 13px; color: #9aa0a6; margin-bottom: 20px; }
  .hub-frame {
    width: 1024px; max-width: 100%;
    aspect-ratio: 1024 / 600;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,.5);
    border: 12px solid #2d2d2d;
    background: #faf9f7;
    position: relative;
  }
  .hub-frame iframe {
    width: 100%; height: 100%;
    border: none; display: block;
  }
  .controls { margin-top: 20px; display: flex; gap: 12px; }
  .controls button {
    font: inherit; font-size: 14px;
    padding: 10px 24px; border-radius: 999px;
    border: 1px solid #3c4043; background: #2d2d2d; color: #e8e8e8;
    cursor: pointer;
  }
  .controls button:hover { background: #3c4043; }
  .note { margin-top: 16px; font-size: 12px; color: #5f6368; max-width: 600px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <h1>Maple Receiver — Nest Hub Preview</h1>
  <p>1024 × 600 · same proportions as your Hub</p>
  <div class="hub-frame">
    <iframe id="preview" title="Maple receiver preview"></iframe>
  </div>
  <div class="controls">
    <button onclick="reload()">↻ Replay demo</button>
    <button onclick="toggleSize()">Toggle 1:1 / fit</button>
  </div>
  <p class="note">The demo auto-plays a sample voice note. Use your browser zoom (Cmd/Ctrl +) to inspect details. This replicates the Hub's 1024×600 viewport — what you see here is what the Hub renders.</p>
<script>
  // Load with cache-buster so preview always shows latest
  document.getElementById('preview').src = 'maple-receiver.html?demo=1&t=' + Date.now();
  var frame = document.querySelector('.hub-frame');
  var fitted = true;
  function reload() {
    document.getElementById('preview').src = 'maple-receiver.html?demo=1&t=' + Date.now();
  }
  function toggleSize() {
    fitted = !fitted;
    frame.style.width = fitted ? '1024px' : '100%';
    frame.style.maxWidth = fitted ? '100%' : '1400px';
  }
  // auto-reload when a new version is pushed (poll every 30s)
  var lastCheck = Date.now();
  setInterval(function() {
    fetch('maple-receiver.html?check=' + Date.now(), {method: 'HEAD'})
      .then(function() { /* could compare ETag here */ });
  }, 30000);
</script>
</body>
</html>
