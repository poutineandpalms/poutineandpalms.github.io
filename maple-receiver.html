<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maple Speaker</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1200px 800px at 50% 30%, #2b2118 0%, #171310 55%, #0d0b09 100%);
    color: #f5efe6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .avatar-wrap {
    position: relative;
    width: 340px; height: 340px;
    animation: float 4.5s ease-in-out infinite;
  }
  .avatar-wrap::before {
    content: "";
    position: absolute; inset: -18px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #e8933c, #f5d76e, #e8933c, #c96a1e, #e8933c);
    animation: spin 9s linear infinite;
    filter: blur(2px);
    opacity: 0.9;
  }
  .avatar-wrap::after {
    content: "";
    position: absolute; inset: -18px;
    border-radius: 50%;
    box-shadow: 0 0 90px 18px rgba(232, 147, 60, 0.35);
    animation: glow 3s ease-in-out infinite;
  }
  .avatar-wrap img {
    position: relative;
    width: 340px; height: 340px;
    border-radius: 50%;
    object-fit: cover;
    background: #241d16;
    z-index: 1;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-14px); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes glow {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }
  h1 {
    margin-top: 44px;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  h1 .leaf { color: #e8933c; }
  .sub {
    margin-top: 10px;
    font-size: 26px;
    color: #b9a88f;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .eq {
    margin-top: 34px;
    display: flex; align-items: flex-end; gap: 10px;
    height: 56px;
  }
  .eq span {
    width: 12px;
    border-radius: 6px;
    background: linear-gradient(to top, #e8933c, #f5d76e);
    animation: bounce 1.1s ease-in-out infinite;
    animation-play-state: paused;
    transform: scaleY(0.25);
  }
  body.is-playing .eq span { animation-play-state: running; }
  .eq span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .eq span:nth-child(2) { height: 75%; animation-delay: 0.15s; }
  .eq span:nth-child(3) { height: 100%; animation-delay: 0.3s; }
  .eq span:nth-child(4) { height: 65%; animation-delay: 0.45s; }
  .eq span:nth-child(5) { height: 45%; animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { transform: scaleY(0.35); }
    50%      { transform: scaleY(1); }
  }
  .hint {
    position: absolute; bottom: 26px;
    font-size: 18px; color: #6f6252; letter-spacing: 2px;
  }
</style>
</head>
<body class="is-idle">
  <div class="avatar-wrap">
    <img id="avatar" src="maple.webp" alt="Maple">
  </div>
  <h1 id="title">Maple <span class="leaf">🍁</span></h1>
  <div class="sub" id="subtitle">Ready</div>
  <div class="eq" id="eq"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="hint" id="hint">urn:x-cast:com.maple.speaker</div>
  <audio id="fallback-audio" preload="none"></audio>
<script>
(function () {
  var NAMESPACE = 'urn:x-cast:com.maple.speaker';
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('subtitle');
  var avatarEl = document.getElementById('avatar');
  var hintEl = document.getElementById('hint');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setPlayingUI(playing) {
    document.body.classList.toggle('is-playing', !!playing);
    document.body.classList.remove('is-idle');
  }

  function playAudio(url) {
    if (window.cast && window.cast.framework) {
      try {
        var context = cast.framework.CastReceiverContext.getInstance();
        var req = new cast.framework.messages.LoadRequestData();
        req.media = new cast.framework.messages.MediaInformation();
        req.media.contentId = url;
        req.media.contentType = 'audio/mp3';
        req.media.streamType = cast.framework.messages.StreamType.BUFFERED;
        context.getPlayerManager().load(req);
        return;
      } catch (e) { /* fall through to audio element */ }
    }
    var a = document.getElementById('fallback-audio');
    a.src = url;
    var p = a.play();
    if (p && p.catch) p.catch(function () {});
  }

  function handleMessage(d) {
    d = d || {};
    if (d.title) titleEl.innerHTML = escapeHtml(d.title) + ' <span class="leaf">🍁</span>';
    if (d.subtitle) subEl.textContent = d.subtitle;
    if (d.image) avatarEl.src = d.image;
    hintEl.style.display = 'none';
    if (d.audio_url) {
      playAudio(d.audio_url);
      setPlayingUI(true);
    }
  }

  var isDemo = location.search.indexOf('demo=1') >= 0;

  if (isDemo) {
    // Desktop preview: no Cast framework needed.
    hintEl.textContent = 'demo preview — no Cast framework';
    setTimeout(function () {
      handleMessage({ title: 'Maple', subtitle: 'Demo preview' });
      setPlayingUI(true);
    }, 900);
  } else if (window.cast && window.cast.framework) {
    var context = cast.framework.CastReceiverContext.getInstance();
    context.addCustomMessageListener(NAMESPACE, function (event) {
      handleMessage(event.data);
    });
    var pm = context.getPlayerManager();
    pm.addEventListener(
      cast.framework.events.EventType.PLAYER_STATE_CHANGED,
      function (e) { setPlayingUI(e.status === 'PLAYING'); }
    );
    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    context.start(options);
  } else {
    hintEl.textContent = 'cast framework not loaded';
  }
})();
</script>
</body>
</html>
