<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maple Speaker</title>
<script src="https://www.gstatic.com/cast/sdk/libs/receiver/2.0.0/cast_receiver.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #faf9f7;
    color: #202124;
    display: flex; align-items: center; justify-content: center;
    gap: 32px;
    overflow: hidden;
    padding: 0 32px 0 24px;
    justify-content: flex-start;
    transition: padding 0.6s ease, gap 0.6s ease;
  }
  body.is-playing {
    padding-left: 12px;
    gap: 24px;
  }
  /* ---- avatar with orbit dots ---- */
  .avatar-wrap {
    position: relative;
    width: 480px; height: 480px;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    transition: width .6s ease, height .6s ease;
  }
  body.is-playing .avatar-wrap { width: 480px; height: 480px; }
  /* Splash (idle): centered avatar, title above, meta hidden */
  body:not(.is-playing) {
    justify-content: center;
  }
  body:not(.is-playing) {
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3vh;
  }

  body:not(.is-playing) .avatar-wrap {
    position: static;
    transform: none;
    width: min(480px, 62vh);
    height: min(480px, 62vh);
    margin: 0;
  }
  body:not(.is-playing) .avatar-stage {
    width: min(300px, 42vh);
    height: min(300px, 42vh);
  }
  body:not(.is-playing) .meta {
    display: none;
  }
  #splash-title {
    position: absolute;
    top: 8vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(40px, 8vh, 64px);
    font-weight: 700;
    color: #202124;
    white-space: nowrap;
    z-index: 5;
    transition: opacity .4s ease;
  }
  #splash-title .leaf { color: #d64545; }
  body.is-playing #splash-title {
    opacity: 0;
    pointer-events: none;
  }
  .orbit-layer {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .orbit-front { z-index: 2; }
  .spinner { position: absolute; inset: 0; }
  .odot {
    position: absolute; border-radius: 50%;
    top: 50%; left: 50%;
  }
    transform: rotate(8deg) translateX(171px); box-shadow: 0 0 14px 3px rgba(214,69,69,.55); }
  .orbit-back .odot:nth-child(2) { width: 11px; height: 11px; background: #c98a2e; margin: -5.5px 0 0 -5.5px;
    transform: rotate(163deg) translateX(176px); box-shadow: 0 0 10px 2px rgba(201,138,46,.5); }
  .orbit-back .odot:nth-child(3) { width: 13px; height: 13px; background: #e8788a; margin: -6.5px 0 0 -6.5px;
    transform: rotate(247deg) translateX(168px); box-shadow: 0 0 12px 2px rgba(232,120,138,.5); }
  .orbit-front .odot:nth-child(1) { width: 12px; height: 12px; background: #f5a623; margin: -6px 0 0 -6px;
    transform: rotate(96deg) translateX(174px); box-shadow: 0 0 12px 3px rgba(245,166,35,.6); }
  .orbit-front .odot:nth-child(2) { width: 16px; height: 16px; background: #b3271e; margin: -8px 0 0 -8px;
    transform: rotate(311deg) translateX(173px); box-shadow: 0 0 14px 3px rgba(179,39,30,.55); }
  body.is-playing .orbit-back .odot:nth-child(1) { transform: rotate(8deg) translateX(86px); }
  body.is-playing .orbit-back .odot:nth-child(2) { transform: rotate(163deg) translateX(88px); }
  body.is-playing .orbit-back .odot:nth-child(3) { transform: rotate(247deg) translateX(85px); }
  body.is-playing .orbit-front .odot:nth-child(1) { transform: rotate(96deg) translateX(87px); }
  body.is-playing .orbit-front .odot:nth-child(2) { transform: rotate(311deg) translateX(86px); }
  .avatar-stage {
    position: relative;
    width: 300px; height: 300px;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    z-index: 1;
    border: 2px solid #e0e0e0;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
    transition: width .6s ease, height .6s ease;
  }
  body.is-playing .avatar-stage { width: 300px; height: 300px; }
  .avatar-stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .avatar-stage video.active { opacity: 1; }
  /* ---- text block ---- */
  .meta {
    flex: 1 1 auto;
    max-width: 780px;
    text-align: left;
    display: none;
    flex-direction: column;
    min-height: 0;
    opacity: 0;
    pointer-events: none;
  }
  body.is-playing .meta {
    display: flex;
    max-width: 780px;
    opacity: 1;
    pointer-events: auto;
    padding-top: 150px;
    transition: opacity .8s ease 1.4s;
  }
  h1 {
    margin-top: 24px;
    font-size: 96px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1;
    white-space: nowrap;
    transition: font-size 0.8s ease;
    color: #202124;
  }
  h1 .leaf { color: #d64545; }
  body.is-playing h1 { font-size: 66px; }
  .sub {
    margin-top: 10px;
    font-size: 18px;
    color: #5f6368;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  /* ---- transcript with line highlighting ---- */
  .transcript-wrap {
    margin-top: 24px;
    max-height: 0;
    opacity: 0;
    transform: translateY(12px);
    overflow: hidden;
    transition: max-height 0.9s ease, opacity 0.9s ease, transform 0.9s ease;
  }
  body.is-playing .transcript-wrap {
    max-height: 460px;
    opacity: 1;
    transform: translateY(0);
  }
  .transcript {
    max-height: 480px;
    overflow-y: auto;
    padding-bottom: 60px;
    font-size: 38px;
    line-height: 1.5;
    padding-right: 16px;
    scrollbar-width: none;
  }
  .transcript::-webkit-scrollbar { display: none; }
  .w { /* word span for line measurement */ }
  .tline {
    color: #b8b0a4; /* pale = not yet read */
    transition: color 0.5s ease;
    margin-bottom: 8px;
  }
  .tline.current { color: #202124; /* dark = being read */ font-weight: 500; }
  .tline.read { color: #5f6368; /* medium = already read */ }
  .hint {
    position: absolute; bottom: 20px; left: 0; right: 0;
    text-align: center;
    font-size: 13px; color: #c9c2b8; letter-spacing: 1px;
  }
  .version {
    position: absolute; bottom: 12px; right: 16px;
    font-size: 11px; color: #d8d2c8; letter-spacing: 0.5px;
    background: rgba(0,0,0,0.04); padding: 2px 8px; border-radius: 4px;
  }
</style>
</head>
<body class="is-idle">
  <h1 id="splash-title">Maple <span class="leaf">🍁</span></h1>
  <div class="avatar-wrap" id="avatar-wrap">
    <div class="orbit-layer orbit-front" id="layer-front">
      <div class="spinner" data-mult="0.88"><div class="odot" style="width:30px;height:30px;margin:-15px 0 0 -15px;background:#d64545;transform:translateX(171px);box-shadow:0 0 14px 3px rgba(214,69,69,.6)"></div></div>
      <div class="spinner" data-mult="1.12"><div class="odot" style="width:21px;height:21px;margin:-10.5px 0 0 -10.5px;background:#ffb300;transform:translateX(176px);box-shadow:0 0 10px 2px rgba(255,179,0,.55)"></div></div>
      <div class="spinner" data-mult="0.95"><div class="odot" style="width:21px;height:21px;margin:-10.5px 0 0 -10.5px;background:#a91e14;transform:translateX(168px);box-shadow:0 0 12px 2px rgba(169,30,20,.6)"></div></div>
      <div class="spinner" data-mult="1.05"><div class="odot" style="width:26px;height:26px;margin:-13px 0 0 -13px;background:#f5a623;transform:translateX(174px);box-shadow:0 0 12px 3px rgba(245,166,35,.6)"></div></div>
      <div class="spinner" data-mult="0.92"><div class="odot" style="width:26px;height:26px;margin:-13px 0 0 -13px;background:#e8830c;transform:translateX(173px);box-shadow:0 0 14px 3px rgba(232,131,12,.6)"></div></div>
      <div class="spinner" data-mult="1.08"><div class="odot" style="width:18px;height:18px;margin:-9px 0 0 -9px;background:#c62828;transform:translateX(170px);box-shadow:0 0 12px 2px rgba(198,40,40,.55)"></div></div>
    </div>
    <div class="avatar-stage">
      <video id="vid-idle" class="active" src="maple-idle.mp4" muted loop playsinline autoplay></video>
      <video id="vid-speaking" src="maple-speaking.mp4" muted loop playsinline preload="auto"></video>
    </div>
  </div>
  <div class="meta">
    <h1 id="title">Maple <span class="leaf">🍁</span></h1>
    <div class="sub" id="subtitle">Ready</div>
    <div class="transcript-wrap" id="transcript-wrap">
      <div class="transcript" id="transcript"></div>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="version" id="version"></div>
  <audio id="fallback-audio" preload="none"></audio>
<script>
(function () {
  var NAMESPACE = 'urn:x-cast:com.maple.speaker';
  var RECEIVER_VERSION = 'js-v49';
  var castMgr = null;
  var hintEl = document.getElementById('hint');
  document.getElementById('version').textContent = RECEIVER_VERSION;
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('subtitle');
  var transcriptEl = document.getElementById('transcript');
  var vidIdle = document.getElementById('vid-idle');
  var vidSpeaking = document.getElementById('vid-speaking');
  var scrollRaf = null;
  var lineEls = [];
  var thinkingTimeout = null;
  var pendingText = null;
  // ---- orbit driver: eased angular velocity, per-dot speed multipliers ----
  var spinners = [];
  var orbitVel = 15; // deg/sec, current (eased)
  var orbitTarget = 15; // deg/sec, target
  var SPEEDS = { idle: 15, thinking: 66, spinup: 168, talking: 38 };
  function initOrbit() {
    var els = document.querySelectorAll('.spinner');
    for (var i = 0; i < els.length; i++) {
      // jittered uniform: base 60° apart + ±18° random offset (no clumping, not mechanical)
      var baseAngle = (360 / els.length) * i;
      var jitter = (Math.random() * 36) - 18;
      var startAngle = (baseAngle + jitter + 360) % 360;
      els[i].style.transform = 'rotate(' + startAngle + 'deg)';
      spinners.push({ el: els[i], mult: parseFloat(els[i].getAttribute('data-mult')) || 1, angle: startAngle });
    }
    var last = performance.now();
    var tick = function (now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      orbitVel += (orbitTarget - orbitVel) * 0.04;
      for (var j = 0; j < spinners.length; j++) {
        var s = spinners[j];
        s.angle = (s.angle + orbitVel * s.mult * dt) % 360;
        s.el.style.transform = 'rotate(' + s.angle + 'deg)';
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function setOrbitState(state) {
    orbitTarget = SPEEDS[state] || SPEEDS.idle;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setAvatarMode(mode) {
    var idle = mode !== 'speaking';
    vidIdle.classList.toggle('active', idle);
    vidSpeaking.classList.toggle('active', !idle);
    var show = idle ? vidIdle : vidSpeaking;
    var hide = idle ? vidSpeaking : vidIdle;
    if (show.paused) { var p = show.play(); if (p && p.catch) p.catch(function () {}); }
    hide.pause();
  }

  function stopScroll() {
    if (scrollRaf) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
  }

  function getPosition() {
    var a = document.getElementById('fallback-audio');
    if (a && isFinite(a.duration) && a.duration > 0) {
      return { time: a.currentTime || 0, duration: a.duration };
    }
    return null;
  }

  function driveHighlight() {
    stopScroll();
    var step = function () {
      var pos = getPosition();
      if (pos && lineEls.length > 0) {
        var p = Math.min(1, Math.max(0, pos.time / pos.duration));
        var idx = Math.min(lineEls.length - 1, Math.floor(p * lineEls.length));
        for (var i = 0; i < lineEls.length; i++) {
          lineEls[i].classList.toggle('current', i === idx);
          lineEls[i].classList.toggle('read', i < idx);
        }
        // auto-scroll to keep current line visible
        var cur = lineEls[idx];
        if (cur) {
          var wrapTop = transcriptEl.scrollTop;
          var wrapBottom = wrapTop + transcriptEl.clientHeight;
          var lineTop = cur.offsetTop;
          var lineBottom = lineTop + cur.offsetHeight;
          if (lineTop < wrapTop || lineBottom > wrapBottom) {
            transcriptEl.scrollTop = lineTop - transcriptEl.clientHeight / 2;
          }
        }
      }
      scrollRaf = requestAnimationFrame(step);
    };
    step();
  }

  function flipToPlaying() {
    if (document.body.classList.contains('is-playing')) return;
    var wrap = document.getElementById('avatar-wrap');
    var splashTitle = document.getElementById('splash-title');
    var metaTitle = document.getElementById('title');
    var r1 = wrap.getBoundingClientRect();
    var t1 = splashTitle.getBoundingClientRect();
    document.body.classList.add('is-playing');
    var r2 = wrap.getBoundingClientRect();
    var t2 = metaTitle.getBoundingClientRect();
    var dx = r1.left - r2.left, dy = r1.top - r2.top;
    var sx = r1.width / r2.width, sy = r1.height / r2.height;
    wrap.style.transition = 'none';
    wrap.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
    wrap.style.transformOrigin = 'center';
    var tdx = t2.left - t1.left;
    var tdy = t2.top - t1.top;
    var tsx = t2.width / t1.width;
    splashTitle.style.transition = 'none';
    splashTitle.style.transform = 'translateX(-50%)';
    void wrap.offsetHeight;
    wrap.style.transition = 'transform 1.35s ease-in-out';
    splashTitle.style.transition = 'transform 1.35s ease-in-out, opacity .3s ease 1.1s';
    wrap.style.transform = 'translate(0,0) scale(1,1)';
    splashTitle.style.transform = 'translateX(-50%) translate(' + tdx + 'px,' + tdy + 'px) scale(' + tsx + ')';
    splashTitle.style.transformOrigin = 'top left';
    splashTitle.style.opacity = '0';
    setTimeout(function () {
      wrap.style.transform = ''; wrap.style.transition = '';
      splashTitle.style.display = 'none';
    }, 1400);
  }
  function setPlayingUI(playing) {
    setOrbitState(playing ? 'talking' : 'idle');
    document.body.classList.toggle('is-playing', !!playing);
    document.body.classList.remove('is-idle');
    document.body.classList.remove('is-thinking');
    document.body.classList.remove('is-spinning-up');
    setAvatarMode(playing ? 'speaking' : 'idle');
    if (!playing) {
      var st = document.getElementById('splash-title');
      if (st) { st.style.display = ''; st.style.opacity = ''; st.style.transform = ''; st.style.transition = ''; }
    }
    if (playing) {
      // build visual lines NOW that container is visible (correct measurements)
      if (pendingText) { buildVisualLines(pendingText); pendingText = null; }
      transcriptEl.scrollTop = 0;
      driveHighlight();
    } else stopScroll();
  }

  function setThinkingUI() {
    setOrbitState('thinking');
    document.body.classList.add('is-thinking');
    document.body.classList.remove('is-idle');
    setAvatarMode('speaking');
  }

  function buildVisualLines(text) {
    // Split into words, render, then group by actual visual line (offsetTop)
    transcriptEl.innerHTML = '';
    lineEls = [];
    var words = text.split(/\s+/);
    var wordSpans = [];
    words.forEach(function (w, i) {
      var s = document.createElement('span');
      s.className = 'w';
      s.textContent = w;
      transcriptEl.appendChild(s);
      transcriptEl.appendChild(document.createTextNode(' '));
      wordSpans.push(s);
    });
    // Group words by visual line using offsetTop
    var lines = [];
    var currentLine = [];
    var currentTop = null;
    wordSpans.forEach(function (s) {
      var top = s.offsetTop;
      if (currentTop === null || Math.abs(top - currentTop) < 5) {
        currentLine.push(s);
      } else {
        lines.push(currentLine);
        currentLine = [s];
      }
      currentTop = top;
    });
    if (currentLine.length > 0) lines.push(currentLine);
    // Wrap each visual line in a div for highlighting
    transcriptEl.innerHTML = '';
    lineEls = [];
    lines.forEach(function (lineWords) {
      var div = document.createElement('div');
      div.className = 'tline';
      lineWords.forEach(function (w, i) {
        div.appendChild(w);
        if (i < lineWords.length - 1) div.appendChild(document.createTextNode(' '));
      });
      transcriptEl.appendChild(div);
      lineEls.push(div);
    });
  }

  function playAudio(url) {
    var a = document.getElementById('fallback-audio');
    try {
      a.src = url;
      a.onended = function () {
        setPlayingUI(false);
        // keep UI for 10s, then end the Cast session
        setTimeout(function () {
          try { if (castMgr) castMgr.stop(); } catch (e) {}
        }, 10000);
      };
      a.onplaying = function () {
        // audio is ACTUALLY playing -> sync highlight to this exact moment
        if (thinkingTimeout) { clearTimeout(thinkingTimeout); thinkingTimeout = null; }
        document.body.classList.remove('is-spinning-up');
        document.body.classList.remove('is-thinking');
        setPlayingUI(true); // starts highlight driver in sync
      };
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  var lastMsgText = null;
  function handleMessage(d) {
    d = d || {};
    if (d.text && d.text === lastMsgText) return;
    lastMsgText = d.text || null;
    if (d.title) titleEl.innerHTML = escapeHtml(d.title) + ' <span class="leaf">🍁</span>';
    if (d.subtitle) subEl.textContent = d.subtitle;
    if (d.text) {
      pendingText = d.text;
      // lines built when container becomes visible (in setPlayingUI)
    }
    if (d.audio_url) {
      // thinking until audio actually plays (onplaying -> setPlayingUI)
      flipToPlaying();
      setThinkingUI();
      if (thinkingTimeout) clearTimeout(thinkingTimeout);
      document.body.classList.add('is-spinning-up');
      setOrbitState('spinup');
      // safety: if onplaying never fires, don't stay stuck in thinking
      thinkingTimeout = setTimeout(function () {
        document.body.classList.remove('is-spinning-up');
        setPlayingUI(true);
      }, 8000);
      playAudio(d.audio_url);
    }
  }

  initOrbit();
  setOrbitState('idle');

  var isDemo = location.search.indexOf('demo=1') >= 0;
  if (isDemo) {
    setTimeout(function () {
      handleMessage({
        title: 'Maple',
        subtitle: 'Voice note',
        text: 'Hey Alex! This is the new orbit dots design. Notice how the dots spin fast while Maple is thinking, then settle into a steady rhythm while talking. The transcript highlights line by line as the audio plays.',
        audio_url: 'maple-voice-rx-1791741257.mp3'
      });
    }, 1000);
  } else if (window.cast && window.cast.receiver) {
    var mgr = cast.receiver.CastReceiverManager.getInstance();
    castMgr = mgr;
    var bus = mgr.getCastMessageBus(NAMESPACE);
    bus.onMessage = function (event) {
      try { handleMessage(JSON.parse(event.data)); }
      catch (e) { try { handleMessage(event.data); } catch (x) {} }
    };
    mgr.onSenderConnected = function (event) {
      try { bus.send(event.senderId, JSON.stringify({type: 'READY', version: RECEIVER_VERSION})); } catch (e) {}
    };
    try { mgr.start({statusText: 'Maple'}); } catch (e) {}
  }
})();
</script>
</body>
</html>
