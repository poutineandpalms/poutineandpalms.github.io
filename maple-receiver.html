<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maple Speaker</title>
<script src="https://www.gstatic.com/cast/sdk/libs/receiver/2.0.0/cast_receiver.js"></script>
<style>
  /* ===== Design tokens ===== */
  :root {
    --bg: #faf9f7;
    --ink: #202124;
    --ink-soft: #5f6368;
    --ink-pale: #b8b0a4;
    --accent: #d64545;
    --avatar-size: min(480px, 62vh);
    --avatar-img: min(300px, 42vh);
    --title-splash: clamp(40px, 8vh, 64px);
    --title-playing: clamp(48px, 11vh, 66px);
    --transcript-size: clamp(24px, 6.3vh, 38px);
    --ease-slide: cubic-bezier(.22,.8,.3,1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== Layout: splash (column, centered) vs playing (row, left) ===== */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    width: 100%;
    height: 100%;
    padding: 4vh 4vw;
    transition: flex-direction 0s; /* layout switch is instant; children animate */
  }
  body.is-playing .stage {
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    gap: clamp(16px, 2.5vw, 32px);
    padding: 0 clamp(16px, 3vw, 32px) 0 clamp(8px, 1.2vw, 12px);
  }

  /* ===== Title: single element, flies via CSS ===== */
  #title {
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    z-index: 5;
    font-size: var(--title-splash);
    /* Splash: in normal flow, centered above avatar */
    transition: font-size 1.35s ease-in-out;
  }
  #title .leaf { color: var(--accent); }
  body.is-playing #title {
    /* Playing: absolute, aligned with transcript */
    position: absolute;
    top: 5vh;
    left: var(--title-left, 50%);
    transform: translateX(var(--title-tx, -50%));
    font-size: var(--title-playing);
  }

  /* ===== Avatar with orbit dots ===== */
  .avatar-wrap {
    position: relative;
    width: var(--avatar-size);
    height: var(--avatar-size);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-stage {
    position: relative;
    width: var(--avatar-img);
    height: var(--avatar-img);
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    z-index: 1;
    border: 2px solid #e0e0e0;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  .avatar-stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .avatar-stage video.active { opacity: 1; }

  /* Orbit: dots positioned via CSS var --orbit-r (responsive) */
  .orbit-layer {
    position: absolute; inset: 0;
    pointer-events: none;
    --orbit-r: calc(var(--avatar-size) * 0.36);
  }
  .orbit-front { z-index: 2; }
  .spinner { position: absolute; inset: 0; }
  .odot {
    position: absolute; border-radius: 50%;
    top: 50%; left: 50%;
  }

  /* ===== Text block (transcript) ===== */
  .meta {
    flex: 1 1 auto;
    max-width: min(780px, 60vw);
    min-width: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
  }
  body:not(.is-playing) .meta {
    display: none;
  }
  body.is-playing .meta {
    pointer-events: auto;
    padding-top: 11vh;
  }
  body.is-playing .meta.show {
    opacity: 1;
    transition: opacity 0.8s ease;
  }
  .sub {
    margin-top: 1vh;
    font-size: clamp(12px, 2.4vh, 18px);
    color: var(--ink-soft);
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .transcript-wrap {
    margin-top: 2.5vh;
    overflow: hidden;
  }
  .transcript {
    max-height: 62vh;
    overflow-y: auto;
    padding-bottom: 8vh;
    font-size: var(--transcript-size);
    line-height: 1.5;
    padding-right: 16px;
    scrollbar-width: none;
  }
  .transcript::-webkit-scrollbar { display: none; }
  .tline {
    color: var(--ink-pale);
    transition: color 0.5s ease;
    margin-bottom: 1vh;
  }
  .tline.current { color: var(--ink); font-weight: 500; }
  .tline.read { color: var(--ink-soft); }

  .version {
    position: absolute; bottom: 12px; right: 16px;
    font-size: 11px; color: #d8d2c8; letter-spacing: 0.5px;
    background: rgba(0,0,0,0.04); padding: 2px 8px; border-radius: 4px;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <h1 id="title">Maple <span class="leaf">🍁</span></h1>
    <div class="avatar-wrap" id="avatar-wrap">
      <div class="orbit-layer orbit-front" id="layer-front"><!-- dots injected by JS --></div>
      <div class="avatar-stage">
        <video id="vid-idle" class="active" src="maple-idle.mp4" muted loop playsinline autoplay></video>
        <video id="vid-speaking" src="maple-speaking.mp4" muted loop playsinline preload="auto"></video>
      </div>
    </div>
    <div class="meta" id="meta">
      <div class="sub" id="subtitle"></div>
      <div class="transcript-wrap">
        <div class="transcript" id="transcript"></div>
      </div>
    </div>
  </div>
  <div class="version" id="version"></div>
  <audio id="fallback-audio" preload="none"></audio>
<script>
(function () {
  'use strict';
  var NAMESPACE = 'urn:x-cast:com.maple.speaker';
  var RECEIVER_VERSION = 'js-v60';
  var castMgr = null;

  document.getElementById('version').textContent = RECEIVER_VERSION;

  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('subtitle');
  var transcriptEl = document.getElementById('transcript');
  var metaEl = document.getElementById('meta');
  var wrapEl = document.getElementById('avatar-wrap');
  var vidIdle = document.getElementById('vid-idle');
  var vidSpeaking = document.getElementById('vid-speaking');

  /* ===== Orbit dots: generated by JS (clean, no hardcoded HTML) ===== */
  var DOTS = [
    { size: 30, color: '#d64545', glow: 'rgba(214,69,69,.6)' },
    { size: 14, color: '#ffb300', glow: 'rgba(255,179,0,.55)' },
    { size: 21, color: '#a91e14', glow: 'rgba(169,30,20,.6)' },
    { size: 17, color: '#f5a623', glow: 'rgba(245,166,35,.6)' },
    { size: 26, color: '#e8830c', glow: 'rgba(232,131,12,.6)' },
    { size: 18, color: '#c62828', glow: 'rgba(198,40,40,.55)' }
  ];
  var SPEEDS = { idle: 15, thinking: 66, spinup: 168, talking: 38 };
  var spinners = [];
  var orbitVel = SPEEDS.idle, orbitTarget = SPEEDS.idle;

  function initOrbit() {
    var layer = document.getElementById('layer-front');
    DOTS.forEach(function (d, i) {
      var spinner = document.createElement('div');
      spinner.className = 'spinner';
      // Per-dot speed multiplier (organic, not mechanical)
      var mults = [0.88, 1.12, 0.95, 1.05, 0.92, 1.08];
      var dot = document.createElement('div');
      dot.className = 'odot';
      // Hardcode inline styles (Hub drops CSS-var dot colors — v24 lesson)
      dot.style.cssText =
        'width:' + d.size + 'px;height:' + d.size + 'px;' +
        'margin:' + (-d.size/2) + 'px 0 0 ' + (-d.size/2) + 'px;' +
        'background:' + d.color + ';' +
        'transform:translateX(var(--orbit-r));' +
        'box-shadow:0 0 12px 3px ' + d.glow + ';';
      spinner.appendChild(dot);
      layer.appendChild(spinner);
      // Jittered uniform distribution: 60° apart ± 18°
      var startAngle = ((360 / DOTS.length) * i + (Math.random() * 36 - 18) + 360) % 360;
      spinner.style.transform = 'rotate(' + startAngle + 'deg)';
      spinners.push({ el: spinner, mult: mults[i % mults.length], angle: startAngle });
    });
    var last = performance.now();
    (function tick(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      orbitVel += (orbitTarget - orbitVel) * 0.04; // eased accel/decel
      for (var j = 0; j < spinners.length; j++) {
        var s = spinners[j];
        s.angle = (s.angle + orbitVel * s.mult * dt) % 360;
        s.el.style.transform = 'rotate(' + s.angle + 'deg)';
      }
      requestAnimationFrame(tick);
    })(last);
  }
  function setOrbitState(state) { orbitTarget = SPEEDS[state] || SPEEDS.idle; }

  /* ===== Avatar videos ===== */
  function setAvatarMode(mode) {
    var idle = mode !== 'speaking';
    vidIdle.classList.toggle('active', idle);
    vidSpeaking.classList.toggle('active', !idle);
    var show = idle ? vidIdle : vidSpeaking;
    var hide = idle ? vidSpeaking : vidIdle;
    if (show.paused) { var p = show.play(); if (p && p.catch) p.catch(function () {}); }
    hide.pause();
  }

  /* ===== Transcript highlighting ===== */
  var lineEls = [], scrollRaf = null, pendingText = null;

  function getPosition() {
    var a = document.getElementById('fallback-audio');
    if (a && isFinite(a.duration) && a.duration > 0)
      return { time: a.currentTime || 0, duration: a.duration };
    return null;
  }

  function driveHighlight() {
    if (scrollRaf) cancelAnimationFrame(scrollRaf);
    (function step() {
      var pos = getPosition();
      if (pos && lineEls.length) {
        var p = Math.min(1, Math.max(0, pos.time / pos.duration));
        var idx = Math.min(lineEls.length - 1, Math.floor(p * lineEls.length));
        for (var i = 0; i < lineEls.length; i++) {
          lineEls[i].classList.toggle('current', i === idx);
          lineEls[i].classList.toggle('read', i < idx);
        }
        var cur = lineEls[idx];
        if (cur) {
          var wt = transcriptEl.scrollTop, wb = wt + transcriptEl.clientHeight;
          var lt = cur.offsetTop, lb = lt + cur.offsetHeight;
          if (lt < wt || lb > wb) transcriptEl.scrollTop = lt - transcriptEl.clientHeight / 2;
        }
      }
      scrollRaf = requestAnimationFrame(step);
    })();
  }

  function buildVisualLines(text) {
    transcriptEl.innerHTML = ''; lineEls = [];
    var words = text.split(/\s+/), spans = [];
    words.forEach(function (w) {
      var s = document.createElement('span');
      s.textContent = w;
      transcriptEl.appendChild(s);
      transcriptEl.appendChild(document.createTextNode(' '));
      spans.push(s);
    });
    var lines = [], cur = [], top = null;
    spans.forEach(function (s) {
      if (top === null || Math.abs(s.offsetTop - top) < 5) cur.push(s);
      else { lines.push(cur); cur = [s]; }
      top = s.offsetTop;
    });
    if (cur.length) lines.push(cur);
    transcriptEl.innerHTML = ''; lineEls = [];
    lines.forEach(function (lw) {
      var div = document.createElement('div');
      div.className = 'tline';
      lw.forEach(function (w, i) {
        div.appendChild(w);
        if (i < lw.length - 1) div.appendChild(document.createTextNode(' '));
      });
      transcriptEl.appendChild(div);
      lineEls.push(div);
    });
  }

  /* ===== Splash → playing transition =====
     Avatar slides via FLIP (CSS transition fallback if no WAAPI).
     Title flies via CSS (top/left/font-size). Meta fades in after. */
  function flipToPlaying() {
    if (document.body.classList.contains('is-playing')) return;
    var r1 = wrapEl.getBoundingClientRect();
    document.body.classList.add('is-playing');
    // Align title with transcript left edge
    var metaLeft = metaEl.getBoundingClientRect().left;
    document.documentElement.style.setProperty('--title-left', metaLeft + 'px');
    document.documentElement.style.setProperty('--title-tx', '0');
    var r2 = wrapEl.getBoundingClientRect();
    var dx = r1.left - r2.left, dy = r1.top - r2.top;
    var sx = r1.width / r2.width, sy = r1.height / r2.height;
    var from = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
    var to = 'translate(0,0) scale(1,1)';
    if (wrapEl.animate) {
      wrapEl.animate(
        [{ transform: from }, { transform: to }],
        { duration: 1350, easing: 'ease-in-out', fill: 'forwards' }
      );
    } else {
      // Fallback: CSS transition (older browsers, e.g. Vizio TV)
      wrapEl.style.transition = 'none';
      wrapEl.style.transform = from;
      void wrapEl.offsetHeight;
      wrapEl.style.transition = 'transform 1.35s ease-in-out';
      wrapEl.style.transform = to;
      setTimeout(function () { wrapEl.style.transition = ''; wrapEl.style.transform = ''; }, 1400);
    }
    setTimeout(function () { metaEl.classList.add('show'); }, 1400);
  }

  /* ===== UI states ===== */
  var thinkingTimeout = null;
  function setPlayingUI(playing) {
    setOrbitState(playing ? 'talking' : 'idle');
    document.body.classList.toggle('is-playing', !!playing);
    setAvatarMode(playing ? 'speaking' : 'idle');
    if (!playing) {
      metaEl.classList.remove('show');
      document.body.classList.remove('is-playing');
      document.documentElement.style.setProperty('--title-left', '50%');
      document.documentElement.style.setProperty('--title-tx', '-50%');
      if (scrollRaf) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
    } else {
      if (pendingText) { buildVisualLines(pendingText); pendingText = null; }
      transcriptEl.scrollTop = 0;
      driveHighlight();
    }
  }
  function setThinkingUI() {
    setOrbitState('thinking');
    setAvatarMode('speaking');
  }

  /* ===== Audio ===== */
  function playAudio(url) {
    var a = document.getElementById('fallback-audio');
    try {
      a.src = url;
      a.onended = function () {
        setPlayingUI(false);
        setTimeout(function () { try { if (castMgr) castMgr.stop(); } catch (e) {} }, 10000);
      };
      a.onplaying = function () {
        if (thinkingTimeout) { clearTimeout(thinkingTimeout); thinkingTimeout = null; }
        // Ensure minimum 2.5s of fast spinup so it's visible (fast LAN loads audio quickly)
        var elapsed = Date.now() - spinupStart;
        var delay = Math.max(0, 2500 - elapsed);
        setTimeout(function () {
          setOrbitState('talking');
          setPlayingUI(true);
        }, delay);
      };
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  /* ===== Messages ===== */
  var lastMsgText = null;
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var spinupStart = 0;
  function handleMessage(d) {
    d = d || {};
    if (d.text && d.text === lastMsgText) return;
    lastMsgText = d.text || null;
    if (d.title) titleEl.innerHTML = escapeHtml(d.title) + ' <span class="leaf">🍁</span>';
    if (d.subtitle) subEl.textContent = d.subtitle;
    if (d.text) pendingText = d.text;
    if (d.audio_url) {
      flipToPlaying();
      setThinkingUI();
      if (thinkingTimeout) clearTimeout(thinkingTimeout);
      setOrbitState('spinup');
      spinupStart = Date.now();
      thinkingTimeout = setTimeout(function () { setPlayingUI(true); }, 8000);
      playAudio(d.audio_url);
    }
  }

  initOrbit();

  /* ===== Demo mode ===== */
  var isDemo = location.search.indexOf('demo=1') >= 0;
  if (isDemo) {
    setTimeout(function () {
      flipToPlaying();
      setThinkingUI();
      pendingText = 'Hey Alex! This is the new orbit dots design. Notice how the dots spin fast while Maple is thinking, then settle into a steady rhythm while talking. The transcript highlights line by line as the audio plays.';
      setTimeout(function () {
        setPlayingUI(true);
        // Simulated 20s clock (demo only, does not leak: scoped var)
        var t0 = Date.now();
        var demoClock = function () {
          var el = (Date.now() - t0) / 1000;
          if (el > 20) { t0 = Date.now(); el = 0; }
          return { time: el, duration: 20 };
        };
        // Temporarily override for demo; restore on next real message
        var realGetPosition = getPosition;
        getPosition = demoClock;
        // Store restore fn so handleMessage can reset it
        window.__restoreClock = function () { getPosition = realGetPosition; };
      }, 1500);
    }, 1000);
  } else if (window.cast && window.cast.receiver) {
    var mgr = cast.receiver.CastReceiverManager.getInstance();
    castMgr = mgr;
    var bus = mgr.getCastMessageBus(NAMESPACE);
    bus.onMessage = function (event) {
      try {
        if (window.__restoreClock) { window.__restoreClock(); window.__restoreClock = null; }
        handleMessage(JSON.parse(event.data));
      } catch (e) { try { handleMessage(event.data); } catch (x) {} }
    };
    mgr.onSenderConnected = function (event) {
      try { bus.send(event.senderId, JSON.stringify({ type: 'READY', version: RECEIVER_VERSION })); } catch (e) {}
    };
    try { mgr.start({ statusText: 'Maple' }); } catch (e) {}
  }
})();
</script>
</body>
</html>
