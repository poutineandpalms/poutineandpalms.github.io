<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Maple Minimal Test</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body style="background:#1a1a1a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
<h1>MINIMAL RECEIVER v1</h1>
<script>
try {
  var ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener('urn:x-cast:com.maple.speaker', function (e) {
    document.querySelector('h1').textContent = 'MSG: ' + JSON.stringify(e.data).substring(0, 80);
  });
  ctx.start();
  document.querySelector('h1').textContent = 'MINIMAL RECEIVER v1 - READY';
} catch (err) {
  document.querySelector('h1').textContent = 'INIT ERROR: ' + err.message;
}
</script></body></html>
